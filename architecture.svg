<text x="860.0" y="56.0" font-size="20" fill="#1e1e1e" text-anchor="middle">Your workstation</text>
<text x="860.0" y="81.0" font-size="20" fill="#1e1e1e" text-anchor="middle">macOS or Linux, AWS CLI v2</text>
<text x="64.0" y="233.0" font-size="20" fill="#1971c2">VPC 10.0.0.0/16  ·  one AZ  ·  no internet gateway, no NAT</text>
<text x="104.0" y="293.1" font-size="18" fill="#2f9e44">Private subnet 10.0.11.0/24  ·  route table: local only</text>
<text x="715.0" y="364.6" font-size="18" fill="#1e1e1e" text-anchor="middle">EICE endpoint</text>
<text x="715.0" y="387.1" font-size="18" fill="#1e1e1e" text-anchor="middle">ACCESS_METHOD=eice</text>
<text x="858.0" y="374.8" font-size="24" fill="#868e96">or</text>
<text x="916.0" y="321.3" font-size="14" fill="#868e96">ACCESS_METHOD=ssm</text>
<text x="1070.0" y="362.2" font-size="16" fill="#1e1e1e" text-anchor="middle">SSM endpoints x3</text>
<text x="1070.0" y="382.2" font-size="16" fill="#1e1e1e" text-anchor="middle">ssm, ssmmessages, ec2messages</text>
<text x="1070.0" y="442.2" font-size="16" fill="#1e1e1e" text-anchor="middle">Jump host</text>
<text x="1070.0" y="462.2" font-size="16" fill="#1e1e1e" text-anchor="middle">no inbound ports</text>
<text x="622.0" y="165.2" font-size="16" fill="#868e96">EICE open-tunnel</text>
<text x="1025.0" y="165.2" font-size="16" fill="#868e96">SSM start-session</text>
<text x="1032.0" y="61.2" font-size="16" fill="#868e96">AWS API</text>
<text x="330.0" y="598.4" font-size="18" fill="#1e1e1e" text-anchor="middle">Internal NLB</text>
<text x="330.0" y="620.9" font-size="18" fill="#1e1e1e" text-anchor="middle">private IP = VIP 10.0.11.210</text>
<text x="330.0" y="643.4" font-size="18" fill="#1e1e1e" text-anchor="middle">TCP 443 · 6443 · 30003 · 5080</text>
<text x="895.0" y="555.2" font-size="16" fill="#1e1e1e" text-anchor="middle">node 1 (leader)</text>
<text x="895.0" y="575.2" font-size="16" fill="#1e1e1e" text-anchor="middle">VerteX appliance, m5.2xlarge</text>
<text x="895.0" y="595.2" font-size="16" fill="#1e1e1e" text-anchor="middle">300 GB root, 500 GB data</text>
<text x="895.0" y="655.2" font-size="16" fill="#1e1e1e" text-anchor="middle">node 2</text>
<text x="895.0" y="675.2" font-size="16" fill="#1e1e1e" text-anchor="middle">VerteX appliance, m5.2xlarge</text>
<text x="895.0" y="695.2" font-size="16" fill="#1e1e1e" text-anchor="middle">300 GB root, 500 GB data</text>
<text x="895.0" y="755.2" font-size="16" fill="#1e1e1e" text-anchor="middle">node 3</text>
<text x="895.0" y="775.2" font-size="16" fill="#1e1e1e" text-anchor="middle">VerteX appliance, m5.2xlarge</text>
<text x="895.0" y="795.2" font-size="16" fill="#1e1e1e" text-anchor="middle">300 GB root, 500 GB data</text>
<text x="548.0" y="534.2" font-size="15" fill="#6741d9">443 / 6443 / 30003 / 5080</text>
<text x="548.0" y="553.0" font-size="15" fill="#6741d9">both ways</text>
<text x="640.0" y="470.2" font-size="16" fill="#e8590c">all ports</text>
<text x="1084.0" y="652.2" font-size="15" fill="#2f9e44">nodes also talk</text>
<text x="1084.0" y="671.0" font-size="15" fill="#2f9e44">directly to each</text>
<text x="1084.0" y="689.8" font-size="15" fill="#2f9e44">other (all traffic)</text>
<text x="130.0" y="713.3" font-size="14" fill="#868e96">Create the NLB after Deploy Cluster: Local UI refuses</text>
<text x="130.0" y="730.8" font-size="14" fill="#868e96">a VIP that any device already owns.</text>
<text x="130.0" y="763.3" font-size="14" fill="#868e96">Target groups keep client IP preservation off, so a</text>
<text x="130.0" y="780.8" font-size="14" fill="#868e96">node can reach itself through the VIP.</text>
</svg>
